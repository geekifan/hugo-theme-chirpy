{{ if hugo.IsMultilingual }}
  <div class="lang-dropdown">
    <select class="lang-select" onchange="location = this.value;">
      {{ $currentLang := .Site.Language.Name }}
      {{ range hugo.Sites }}
        <option value="{{ .Home.RelPermalink }}" {{ if eq .Language.Name $currentLang }}selected{{ end }}>
          {{ .Language.Label }}
        </option>
      {{ end }}
    </select>
  </div>
{{ end }}
